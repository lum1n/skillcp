<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skillcp</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-name">skillcp</span>
        </div>
        <nav class="nav" role="tablist">
          <button type="button" class="nav-link active" data-tab="skills">skills</button>
          <button type="button" class="nav-link" data-tab="mcp">mcp</button>
          <button type="button" class="nav-link" data-tab="harnesses">harnesses</button>
        </nav>
        <div class="sidebar-foot" id="stats"></div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h2 id="page-title" class="page-title">skills</h2>
          <div class="topbar-actions">
            <button type="button" class="btn" id="btn-import">import</button>
            <button type="button" class="btn primary" id="btn-sync">sync</button>
          </div>
        </header>

        <div class="content">
          <p class="library" id="library-path">loading…</p>

          <section class="health hidden" id="health">
            <p class="health-kicker">library health</p>
            <p class="health-lead" id="health-lead"></p>
            <ul class="health-list" id="health-list"></ul>
          </section>
          <section class="activity hidden" id="activity"></section>

          <section id="panel-skills" class="panel">
            <div class="split">
              <div class="split-list">
                <div class="panel-head">
                  <h1>skills</h1>
                  <button type="button" class="btn sm" id="btn-new-skill">new</button>
                </div>
                <form class="add-row" id="form-add-skill">
                  <input name="source" placeholder="path, git url, or owner/repo" />
                  <input name="path" placeholder="subdir" />
                  <button type="submit" class="btn">add</button>
                </form>
                <ul class="list" id="skill-list"></ul>
              </div>
              <div class="detail split-detail" id="skill-detail">
                <p class="empty">select a skill to view or edit it</p>
              </div>
            </div>
          </section>

          <section id="panel-mcp" class="panel hidden">
            <div class="split">
              <div class="split-list">
                <div class="panel-head">
                  <h1>mcp servers</h1>
                  <button type="button" class="btn sm" id="btn-new-mcp">new</button>
                </div>
                <ul class="list" id="mcp-list"></ul>
              </div>
              <form class="detail form-stack split-detail" id="form-mcp">
                <h2 id="mcp-form-title">add server</h2>
                <label>name<input name="name" required placeholder="github" /></label>
                <label>transport
                  <select name="type">
                    <option value="stdio">stdio</option>
                    <option value="http">http</option>
                    <option value="sse">sse</option>
                  </select>
                </label>
                <label>command<input name="command" placeholder="npx" /></label>
                <label>args<input name="args" placeholder="-y, @scope/server" /></label>
                <label>url<input name="url" placeholder="https://example.com/mcp" /></label>
                <label>env <span class="hint">KEY=value, one per line</span>
                  <textarea name="env" rows="3" placeholder="GITHUB_TOKEN=$GITHUB_TOKEN"></textarea>
                </label>
                <label>headers <span class="hint">KEY=value, one per line</span>
                  <textarea name="headers" rows="2"></textarea>
                </label>
                <label>cwd<input name="cwd" /></label>
                <div class="row-actions">
                  <button type="submit" class="btn primary">save</button>
                  <button type="button" class="btn ghost" id="btn-mcp-reset">clear</button>
                </div>
              </form>
            </div>
          </section>

          <section id="panel-harnesses" class="panel hidden">
            <div class="panel-head">
              <h1>harnesses</h1>
              <label class="check"><input type="checkbox" id="sync-project" /> project files</label>
              <label class="check"><input type="checkbox" id="sync-all" /> all harnesses</label>
              <label class="check"><input type="checkbox" id="import-overwrite" /> overwrite on import</label>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>harness</th>
                    <th>status</th>
                    <th>skills</th>
                    <th>mcp</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="harness-rows"></tbody>
              </table>
            </div>
            <div class="row-actions">
              <button type="button" class="btn" id="btn-install">install skillcp plugin</button>
              <button type="button" class="btn primary" id="btn-sync-all">sync all detected</button>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div class="toast hidden" id="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
